<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Awaz-e-Mohalla</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇵🇰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <h2>📣 Admin Login</h2>
    <p>Awaz-e-Mohalla management dashboard</p>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="text" id="login-email" placeholder="admin@awazemohalla.pk">
      </div>
      <div class="form-group">
        <label for="login-pass">Password</label>
        <input type="text" id="login-pass" placeholder="admin123">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>
    <div class="demo-hint">🔑 Demo credentials — Email: <strong>admin@awazemohalla.pk</strong> · Password: <strong>admin123</strong></div>
    <p style="margin-top:14px"><a href="index.html" style="color:var(--primary);font-size:13px;font-weight:600">← Back to site</a></p>
  </div>
</div>

<!-- ADMIN APP -->
<div class="admin-layout hidden" id="admin-app">
  <aside class="admin-sidebar">
    <div class="brand">📣 AWAZ-E-MOHALLA</div>
    <nav id="admin-nav">
      <a href="#overview" data-view="overview" class="active">📊 Overview</a>
      <a href="#reports" data-view="reports">📋 Reports</a>
      <a href="#map" data-view="map">🗺️ Map</a>
      <a href="#users" data-view="users">👥 Users</a>
      <a href="#analytics" data-view="analytics">📈 Analytics</a>
      <a href="#settings" data-view="settings">⚙️ Settings</a>
    </nav>
    <div style="margin-top:30px;padding:0 12px">
      <button class="btn btn-outline btn-sm btn-block" id="logout-btn" style="color:#fff;border-color:rgba(255,255,255,.3)">Log Out</button>
      <a href="index.html" style="display:block;text-align:center;color:#8c998f;font-size:12.5px;margin-top:10px">← Back to site</a>
    </div>
  </aside>
  <main class="admin-main" id="admin-main"></main>
</div>

<div class="demo-badge">DEMO MODE</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
<script src="admin.js"></script>
<script src="features.js"></script>
</body>
</html>
